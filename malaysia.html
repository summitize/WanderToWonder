<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaysia Project | WanderToWonder</title>
    <meta name="description"
        content="A travel journal from Malaysia with cultural highlights, tropical landscapes, and city discoveries.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://summitize.github.io/WanderToWonder/malaysia.html">
    <meta property="og:title" content="Malaysia Project | WanderToWonder">
    <meta property="og:description" content="A travel journal from Malaysia with cultural highlights, tropical landscapes, and city discoveries.">
    <meta property="og:image" content="https://summitize.github.io/WanderToWonder/photos/malaysia/hero.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Malaysia Project | WanderToWonder">
    <meta property="twitter:description" content="A travel journal from Malaysia with cultural highlights, tropical landscapes, and city discoveries.">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="page-header">
            <h1 class="page-title">Malaysia</h1>
            <p class="page-subtitle">Culture, Cuisine, and Tropical Exploration</p>
            <button class="btn btn-secondary share-page-btn" id="share-btn">
                <span>📤</span> Share Project
            </button>
        </section>

        <div class="content-section">
            <div class="container">
                <div id="malaysia-gallery"></div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="gallery.js"></script>
    <script>
        const galleryApiBase = 'PASTE_CLOUDFLARE_WORKER_URL_HERE';
        const normalizedGalleryApiBase = (
            typeof galleryApiBase === 'string'
            && galleryApiBase.trim().length > 0
            && !galleryApiBase.includes('PASTE_')
        ) ? galleryApiBase.replace(/\/+$/, '') : '';
        const malaysiaApiEndpoint = normalizedGalleryApiBase
            ? `${normalizedGalleryApiBase}/photos?trip=malaysia`
            : '';

        // Replace this with your public OneDrive shared folder link for Malaysia photos.
        const malaysiaOneDriveShareLink = 'PASTE_MALAYSIA_ONEDRIVE_SHARED_ALBUM_LINK_HERE';

        PhotoGallery.loadWithSourceToggle({
            containerId: 'malaysia-gallery',
            apiEndpoint: malaysiaApiEndpoint,
            shareLink: malaysiaOneDriveShareLink,
            localJsonPath: 'data/malaysia.json',
            destinationName: 'Malaysia',
            defaultMode: 'auto',
            modeStorageKey: 'gallery-mode:malaysia',
            showModeToggle: false
        });
    </script>
    <script src="script.js"></script>
</body>

</html>
