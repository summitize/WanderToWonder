<div class="auth-modal" id="auth-modal" hidden aria-hidden="true">
    <div class="auth-modal-backdrop" data-auth-close></div>
    <div class="auth-modal-panel" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
        <button type="button" class="auth-modal-close" data-auth-close aria-label="Close sign in dialog">&times;</button>
        <h2 id="auth-modal-title" class="auth-modal-title">Sign in to WanderToWonder</h2>
        <p class="auth-modal-subtitle">Securely save your likes, comments, and preferences across devices.</p>
        <div class="auth-provider-buttons">
            <button type="button" class="auth-provider-btn auth-provider-google" data-auth-provider="google">
                <span class="auth-provider-icon">G</span>
                <span>Continue with Google</span>
            </button>
            <button type="button" class="auth-provider-btn auth-provider-facebook" data-auth-provider="facebook">
                <span class="auth-provider-icon">f</span>
                <span>Continue with Facebook</span>
            </button>
            <button type="button" class="auth-provider-btn auth-provider-apple" data-auth-provider="apple">
                <span class="auth-provider-icon"></span>
                <span>Continue with Apple</span>
            </button>
        </div>
        <p class="auth-modal-note" id="auth-modal-note" role="status"></p>
    </div>
</div>
