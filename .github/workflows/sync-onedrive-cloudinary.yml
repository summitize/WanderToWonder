name: Sync Graph to Cloudinary

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: graph-cloudinary-sync
  cancel-in-progress: false

jobs:
  parse-trips:
    runs-on: ubuntu-latest
    outputs:
      trips: ${{ steps.parse.outputs.trips }}
    steps:
      - name: Parse trip list
        id: parse
        env:
          TRIP_SHARE_URLS_JSON: ${{ secrets.TRIP_SHARE_URLS_JSON || vars.TRIP_SHARE_URLS_JSON }}
        run: |
          if [ -z "$TRIP_SHARE_URLS_JSON" ]; then
            echo "Missing TRIP_SHARE_URLS_JSON"
            exit 1
          fi
          python3 -c "
          import json, os
          trips = json.loads(os.environ['TRIP_SHARE_URLS_JSON'])
          print(f'trips={json.dumps(list(trips.keys()))}')
          " >> $GITHUB_OUTPUT

  sync:
    runs-on: ubuntu-latest
    needs: parse-trips
    permissions:
      contents: write
      pages: write
    strategy:
      matrix:
        trip: ${{ fromJson(needs.parse-trips.outputs.trips) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and rebase to latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-cloudinary.txt

      - name: Sync Graph shares to Cloudinary and regenerate manifests
        timeout-minutes: 30
        env:
          TRIP_SHARE_URLS_JSON: ${{ secrets.TRIP_SHARE_URLS_JSON || vars.TRIP_SHARE_URLS_JSON }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID || vars.MS_CLIENT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN || vars.MS_REFRESH_TOKEN }}
          MS_TENANT: ${{ secrets.MS_TENANT || vars.MS_TENANT }}
          MS_SCOPE: ${{ secrets.MS_SCOPE || vars.MS_SCOPE }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || vars.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET || vars.CLOUDINARY_API_SECRET }}
          MATRIX_TRIP: ${{ matrix.trip }}
        run: |
          if [ -z "$MS_CLIENT_ID" ] || [ -z "$MS_REFRESH_TOKEN" ]; then
            echo "Missing MS_CLIENT_ID and/or MS_REFRESH_TOKEN"
            exit 1
          fi
          python3 -c "
          import json, os
          all_trips = json.loads(os.environ['TRIP_SHARE_URLS_JSON'])
          trip = os.environ['MATRIX_TRIP']
          single = {trip: all_trips[trip]}
          print(json.dumps(single))
          " > single_trip.json
          echo "Processing trip: $MATRIX_TRIP"
          python -u scripts/sync-graph-cloudinary.py --map-json "$(cat single_trip.json)" --max 100

      - name: Commit and push manifest updates
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No manifest changes for $MATRIX_TRIP."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No staged manifest changes for $MATRIX_TRIP."
            exit 0
          fi
          git commit -m "Automated Graph -> Cloudinary gallery sync for ${MATRIX_TRIP}"

          MAX_ATTEMPTS=4
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS to push changes..."
            if git push; then
              echo "Push succeeded"
              exit 0
            fi
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "Push failed after $MAX_ATTEMPTS attempts."
              exit 1
            fi
            echo "Push failed; fetching latest origin and rebasing..."
            git fetch origin main
            git rebase origin/main
            ATTEMPT=$((ATTEMPT + 1))
          done

