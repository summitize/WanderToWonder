<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="page-header">
            <h1 class="page-title">Malaysia (Kuala Lumpur)</h1>
            <p class="page-subtitle">Culture, Cuisine, and Urban Tropical Exploration</p>
            <div class="page-engagement" data-page-id="malaysia">
                <button type="button" class="btn btn-secondary like-btn" data-like-btn aria-pressed="false">
                    <span class="like-icon" aria-hidden="true">&#9825;</span>
                    <span class="like-label">Like</span>
                    <span class="like-count" data-like-count>0</span>
                </button>
            </div>
        </section>

        <div class="content-section">
            <div class="container">
                <div id="malaysia-gallery"></div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="..\/assets\/js\/gallery.js"></script>
    <script>
        const galleryApiBase = 'PASTE_CLOUDFLARE_WORKER_URL_HERE';
        const normalizedGalleryApiBase = (
            typeof galleryApiBase === 'string'
            && galleryApiBase.trim().length > 0
            && !galleryApiBase.includes('PASTE_')
        ) ? galleryApiBase.replace(/\/+$/, '') : '';
        const malaysiaApiEndpoint = normalizedGalleryApiBase
            ? `${normalizedGalleryApiBase}/photos?trip=malaysia`
            : '';

        // Replace this with your public OneDrive shared folder link for Malaysia photos.
        const malaysiaOneDriveShareLink = 'https://1drv.ms/f/c/97c5e937e7e76f1c/IgDgHsM11KKuTpRjUe6E6jolAed08NsDfL04_DOlYEYxDMI?e=XdlgMH';

        PhotoGallery.loadWithSourceToggle({
            containerId: 'malaysia-gallery',
            apiEndpoint: malaysiaApiEndpoint,
            shareLink: malaysiaOneDriveShareLink,
            localJsonPath: '..\/data/malaysia.json',
            destinationName: 'Malaysia',
            defaultMode: 'auto',
            modeStorageKey: 'gallery-mode:malaysia',
            showModeToggle: false
        });
    </script>
    <script src="..\/assets\/js\/script.js"></script>
</body>
