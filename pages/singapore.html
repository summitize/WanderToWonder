<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore Project | WanderToWonder</title>
    <meta name="description"
        content="A visual travel journal from Singapore featuring cityscapes, gardens, and modern architecture.">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://summitize.github.io/WanderToWonder/singapore.html">
    <meta property="og:title" content="Singapore Project | WanderToWonder">
    <meta property="og:description" content="A visual travel journal from Singapore featuring cityscapes, gardens, and modern architecture.">
    <meta property="og:image" content="https://summitize.github.io/WanderToWonder/photos/singapore/hero.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Singapore Project | WanderToWonder">
    <meta property="twitter:description" content="A visual travel journal from Singapore featuring cityscapes, gardens, and modern architecture.">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="stylesheet" href="..\/assets\/css\/styles.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="page-header">
            <h1 class="page-title">Singapore</h1>
            <p class="page-subtitle">City Gardens and Modern Discoveries</p>
            <div class="page-engagement" data-page-id="singapore">
                <button type="button" class="btn btn-secondary like-btn" data-like-btn aria-pressed="false">
                    <span class="like-icon" aria-hidden="true">&#9825;</span>
                    <span class="like-label">Like</span>
                    <span class="like-count" data-like-count>0</span>
                </button>
            </div>
        </section>

        <div class="content-section">
            <div class="container">
                <div id="singapore-gallery"></div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="..\/assets\/js\/gallery.js"></script>
    <script>
        const galleryApiBase = 'PASTE_CLOUDFLARE_WORKER_URL_HERE';
        const normalizedGalleryApiBase = (
            typeof galleryApiBase === 'string'
            && galleryApiBase.trim().length > 0
            && !galleryApiBase.includes('PASTE_')
        ) ? galleryApiBase.replace(/\/+$/, '') : '';
        const singaporeApiEndpoint = normalizedGalleryApiBase
            ? `${normalizedGalleryApiBase}/photos?trip=singapore`
            : '';

        // Replace this with your public OneDrive shared folder link for Singapore photos.
        const singaporeOneDriveShareLink = 'https://1drv.ms/f/c/97c5e937e7e76f1c/IgA4S8zMtiaKQICmvbQ-IDGdAfW2WyaGIij8-OxmN9chNOI?e=xxoHqC';

        PhotoGallery.loadWithSourceToggle({
            containerId: 'singapore-gallery',
            apiEndpoint: singaporeApiEndpoint,
            shareLink: singaporeOneDriveShareLink,
            localJsonPath: '..\/data/singapore.json',
            destinationName: 'Singapore',
            defaultMode: 'auto',
            modeStorageKey: 'gallery-mode:singapore',
            showModeToggle: false
        });
    </script>
    <script src="..\/assets\/js\/script.js"></script>
</body>

</html>
